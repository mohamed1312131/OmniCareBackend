server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:__disabled__}
            client-secret: ${GOOGLE_CLIENT_SECRET:__disabled__}
            scope: openid,profile,email
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:8080/auth/dev/callback}
  mail:
    from: ${MAIL_FROM:no-reply@omnicare.local}
    verify-base-url: ${VERIFY_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  platform:
    fee:
      default-percentage: ${PLATFORM_FEE_DEFAULT_PERCENTAGE:15}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    signature-algorithm: ${CLOUDINARY_SIGNATURE_ALGORITHM:}

storage:
  provider: ${STORAGE_PROVIDER:cloudinary}
