server.port=8080

spring.application.name=omnicare

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.url=jdbc:postgresql://localhost:5432/app
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:__disabled__}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:__disabled__}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.cors.allowed-origin=http://localhost:5173
app.oauth2.redirect-uri=http://localhost:8080/auth/dev/callback

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:no-reply@omnicare.local}
app.mail.verify-base-url=${VERIFY_BASE_URL:http://localhost:8080}

app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-seconds=3600

app.platform.fee.default-percentage=15

app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}